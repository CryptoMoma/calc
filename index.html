<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leverage Calculator</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#4c1d95">
<style>
  :root { --bg1:#3730a3; --bg2:#6d28d9; --card:#ffffff; --ink:#1e1b4b; --muted:#6b7280; --accent:#5b21b6; --bad:#dc2626; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100%; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
         background:linear-gradient(135deg,var(--bg1),var(--bg2)); color:var(--ink);
         display:flex; align-items:center; justify-content:center; padding:24px 16px; }
  html { height:100%; }
  form { background:var(--card); border-radius:14px; padding:24px; width:100%; max-width:340px;
         box-shadow:0 10px 30px rgba(0,0,0,.25); display:grid; gap:12px; }
  h1 { margin:0; font-size:1.15rem; }
  p  { margin:0; color:var(--muted); font-size:.85rem; }
  input[type=password] { font-size:1rem; padding:.65rem .75rem; border:1px solid #a5b4fc; border-radius:8px; width:100%; }
  input:focus-visible, button:focus-visible { outline:3px solid #a78bfa; outline-offset:2px; }
  label { display:flex; gap:.5rem; align-items:center; font-size:.85rem; color:var(--muted); }
  button { font-size:1rem; font-weight:700; padding:.7rem; border:0; border-radius:8px; background:var(--accent); color:#fff; cursor:pointer; }
  #err { color:var(--bad); font-size:.85rem; min-height:1.1em; }
</style>
</head>
<body>
<form id="f">
  <h1>Leverage Calculator</h1>
  <p>Enter the password to open it.</p>
  <input type="password" id="pw" autocomplete="current-password" aria-label="Password" required>
  <label><input type="checkbox" id="remember" checked> Remember on this device</label>
  <button id="go" type="submit">Unlock</button>
  <div id="err" role="alert"></div>
</form>

const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const KEY_STORE = "calc_unlock_key";

async function keyFromPassword(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name:"PBKDF2", salt:bytes(P.salt), iterations:P.rounds, hash:"SHA-256" },
                                 base, { name:"AES-GCM", length:256 }, true, ["decrypt"]);
}
async function openCalc(key) {
  const plain = await crypto.subtle.decrypt({ name:"AES-GCM", iv:bytes(P.iv) }, key, bytes(P.data));
  const html = new TextDecoder().decode(plain);
  document.open(); document.write(html); document.close();
  await new Promise(r => setTimeout(r, 300));
  if (!window.__calcLoaded) { window.__calcLoaded = true; window.dispatchEvent(new Event("load")); }
}
async function tryStored() {
  let raw = null;
  try { raw = localStorage.getItem(KEY_STORE); } catch (e) {}
  if (!raw) return;
  try {
    const key = await crypto.subtle.importKey("raw", bytes(raw), "AES-GCM", true, ["decrypt"]);
    await openCalc(key);
  } catch (e) {            // stale key (the page was re-locked with a new password): ask again
    try { localStorage.removeItem(KEY_STORE); } catch (e2) {}
  }
}
document.getElementById("f").addEventListener("submit", async ev => {
  ev.preventDefault();
  const err = document.getElementById("err"), go = document.getElementById("go");
  err.textContent = ""; go.disabled = true; go.textContent = "Unlocking…";
  try {
    const key = await keyFromPassword(document.getElementById("pw").value.trim());
    const raw = new Uint8Array(await crypto.subtle.exportKey("raw", key));
    await crypto.subtle.decrypt({ name:"AES-GCM", iv:bytes(P.iv) }, key, bytes(P.data));  // throws if wrong
    if (document.getElementById("remember").checked) {
      try { localStorage.setItem(KEY_STORE, btoa(String.fromCharCode(...raw))); } catch (e) {}
    }
    await openCalc(key);
  } catch (e) {
    err.textContent = "That password didn't work. Check it and try again.";
    go.disabled = false; go.textContent = "Unlock";
  }
});
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
// Only after the page has fully loaded: while it is still loading, document.open() is
// ignored and the calculator would be written underneath this screen instead of replacing it.
if (document.readyState === "complete") tryStored(); else window.addEventListener("load", tryStored);
